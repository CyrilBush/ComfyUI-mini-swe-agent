name: Execution Tests

on:
  push:
    branches: [ main, master, release/** ]
  pull_request:
    branches: [ main, master, release/** ]


jobs:
  test:
    name: Execution tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install CPU PyTorch packages
        run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -r tests-unit/requirements.txt

      - name: Run execution tests
        run: python -m pytest tests/execution -v --skip-timing-checks
