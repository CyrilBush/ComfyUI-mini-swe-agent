name: Test server launches without errors

on:
  push:
    branches: [ main, master, release/** ]
  pull_request:
    branches: [ main, master, release/** ]


jobs:
  test:
    name: Launch and log check
    runs-on: ubuntu-latest
    steps:
      - name: Check out ComfyUI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch, runtime dependencies, and wait-for-it
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install wait-for-it==2.3.0

      - name: Launch ComfyUI in CPU mode and wait for the local port
        shell: bash
        run: |
          python main.py --cpu --listen 127.0.0.1 --port 8188 > console.log 2>&1 &
          wait-for-it --service 127.0.0.1:8188 --timeout 300

      - name: Filter console log and scan for error markers
        shell: bash
        run: |
          set -o pipefail
          grep -vF "Found comfy_kitchen backend triton: {'available': False, 'disabled': True, 'unavailable_reason': \"ImportError: No module named 'triton'\", 'capabilities': []}" console.log \
            | grep -vF "Found comfy_kitchen backend triton: {'available': False, 'disabled': False, 'unavailable_reason': \"ImportError: No module named 'triton'\", 'capabilities': []}" \
            > filtered.log
          cat filtered.log
          if grep -E "ERROR|Error|Exception|Traceback" filtered.log; then
            echo "Found error markers in the ComfyUI console log" >&2
            exit 1
          fi

      - name: Upload raw console log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comfyui-console-log
          path: console.log
          retention-days: 7
          if-no-files-found: warn
